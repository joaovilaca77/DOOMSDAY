<!DOCTYPE html>
<!-- Ao publicar mudanças, aumente o número ?v= em todos os arquivos (busque por "?v=") para o navegador não usar versões antigas. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doom Protocol · Rumo a Doomsday</title>
<meta name="description" content="Checklist e notas dos filmes e séries para assistir antes de Vingadores: Doomsday — com os amigos.">
<meta name="theme-color" content="#050B08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 34' fill='none' stroke='%23C5A059' stroke-width='1.5' stroke-linejoin='round'%3E%3Cpath d='M3 5 Q15 0 27 5 L27 20 Q27 29 15 33 Q3 29 3 20 Z' fill='%23050B08'/%3E%3Cpath d='M7 13 L13 14.5 L13 16 L7 15.5 Z' fill='%236CFF9A' stroke='%236CFF9A'/%3E%3Cpath d='M23 13 L17 14.5 L17 16 L23 15.5 Z' fill='%236CFF9A' stroke='%236CFF9A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/doom.css?v=13">
</head>
<body>
<div class="bg-art"></div>
<div class="bg-stars"></div>

<div id="demo-banner" class="demo-banner" hidden>
  MODO DEMO — os dados ficam só neste navegador. Configure o Firebase em <code>js/firebase-config.js</code> (veja o README).
</div>
<div id="boot" class="boot">Estabelecendo conexão com Latvéria…</div>

<template id="emblem-tpl">
  <svg width="18" height="21" viewBox="0 0 30 34" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 5 Q15 0 27 5 L27 20 Q27 29 15 33 Q3 29 3 20 Z"/><path d="M7 13 L13 14.5 L13 16 L7 15.5 Z" fill="#6CFF9A" stroke="#6CFF9A"/><path d="M23 13 L17 14.5 L17 16 L23 15.5 Z" fill="#6CFF9A" stroke="#6CFF9A"/><path d="M15 7 L15 20"/><path d="M10 23 L20 23 M11 26 L19 26 M12.5 29 L17.5 29"/></svg>
</template>

<!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
<section id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-brand">
      <div class="emblem lg" data-emblem></div>
      <div>
        <div class="kicker gold">Acesso restrito · Latvéria</div>
        <h1>Doom Protocol <span class="gold">//</span> <span class="lit">Rumo a Doomsday</span></h1>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="signin" aria-selected="true">Entrar</button>
      <button type="button" role="tab" data-tab="signup" aria-selected="false">Criar conta</button>
    </div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="f-user">Usuário</label>
        <input id="f-user" class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="20">
        <div class="hint" data-signup-only hidden>3 a 20 caracteres: letras, números, ponto, hífen ou _</div>
      </div>
      <div class="field">
        <label for="f-pass">Senha</label>
        <input id="f-pass" class="input" name="password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <div class="field" data-signup-only hidden>
        <label for="f-pass2">Confirmar senha</label>
        <input id="f-pass2" class="input" name="password2" type="password" autocomplete="new-password" minlength="6">
      </div>
      <div id="login-error" class="form-error" role="alert" hidden></div>
      <button id="login-submit" class="btn-lit block" type="submit"><span>Entrar no protocolo</span></button>
    </form>
  </div>
</section>

<!-- ── APP ───────────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>
  <header class="header">
    <div class="brand">
      <div class="emblem" data-emblem></div>
      <div class="brand-title">Doom Protocol<span class="sub"> <span class="sep">//</span> <span class="lit">Rumo a Doomsday</span></span></div>
    </div>
    <div class="tl-info" id="timeline-info"></div>
    <div class="header-end">
      <span class="counter" id="counter"></span>
      <div class="nav-btns">
        <button type="button" class="round-btn" data-action="prev" title="Anterior (↑)" aria-label="Anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
        <button type="button" class="round-btn" data-action="next" title="Próximo (↓)" aria-label="Próximo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <button type="button" class="sheet-btn" data-action="sheet"><span id="sheet-pct">0%</span> · Arquivo</button>
      <div class="agent"><b id="agent-name"></b><button type="button" data-action="signout">Sair</button></div>
    </div>
  </header>

  <div class="main">
    <div class="stage">
      <div class="track" id="track"><div class="track-inner" id="track-inner"></div></div>
    </div>
    <div class="scrim" id="scrim" data-action="sheet" hidden></div>
    <aside class="aside" id="aside" aria-label="Arquivo de Inteligência"></aside>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script type="module" src="js/app.js?v=13"></script>
</body>
</html>
